plugins { id 'com.android.application' }
android {
    namespace 'com.autoclicker.android'
    compileSdk 35
    defaultConfig {
        applicationId 'com.autoclicker.android'
        minSdk 26
        targetSdk 28
        versionCode 7
        versionName '6.7'
    }
}

dependencies {
    // Modelo OCR latino integrado en la app; el reconocimiento se ejecuta localmente.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
